      <path d="M-80-8 0 32 80-8M0 32V114" stroke="#136d35" stroke-opacity=".25" stroke-width="1.5"/>
      <path d="M-60 2-40 12V27L-60 17ZM-20 37 0 47V62L-20 52Z" fill="#1d8b42"/>
      <path d="M40 12 60 2V17L40 27ZM0 77 20 67V82L0 92Z" fill="#146e35"/>
      <path d="M0-38 20-28 0-18-20-28ZM-40-8-20 2-40 12-60 2Z" fill="#95eba2" fill-opacity=".65"/>
    </g>
    <g id="ruby-cube">
      <path d="M-80-8 0 32V114L-80 74Z" fill="#9d2440"/>
      <path d="M0 32 80-8V74L0 114Z" fill="#6d1732"/>
      <path d="M0-48 80-8 0 32-80-8Z" fill="#db4160"/>
      <path d="M0-36 56-8 0 20-56-8Z" fill="#eb6680"/>
      <path d="M0-24 32-8 0 8-32-8Z" fill="#e94a6c"/>
      <path d="M-66 9-14 35V90L-66 64Z" fill="#b72a4a"/>
      <path d="M-53 24-27 37V69L-53 56Z" fill="#d74061"/>
      <path d="M14 35 66 9V64L14 90Z" fill="#8e1d3c"/>
      <path d="M27 42 53 29V51L27 64Z" fill="#b62a4d"/>
      <path d="M-80-8 0 32 80-8M0 32V114" stroke="#55142b" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
    <g id="white-cube">
