      <path d="M-18-54H18L0-24Z" fill="#fa8da2"/>
      <path d="M-38-30-18-54 0-24-22 0Z" fill="#ef5d7d"/>
      <path d="M18-54 38-30 22 0 0-24Z" fill="#dd3e63"/>
      <path d="M-22 0 0-24 22 0 0 54Z" fill="#d93960"/>
      <path d="M-38-30-22 0 0 54-22 24Z" fill="#a61f42"/>
