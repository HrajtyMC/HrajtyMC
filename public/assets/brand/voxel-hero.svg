<svg xmlns="http://www.w3.org/2000/svg" width="840" height="720" viewBox="0 0 840 720" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Build your own world with HrajtyMC</title>
  <desc id="hero-description">An original illustration of a floating green block island, a dark red ruby block and a faceted ruby crystal. This is artwork, not a game screenshot.</desc>
  <defs>
    <filter id="ground-shadow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="gem-shadow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="background-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#dcefe2" stroke-width="1"/>
    </pattern>
    <clipPath id="grid-circle"><circle cx="420" cy="350" r="294"/></clipPath>
    <g id="grass-cube">
